name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test tests/Services.UnitTests/Glasgow.Services.UnitTests.csproj --configuration Release --verbosity normal

      - name: Run functional tests
        run: dotnet test tests/Services.FunctionalTests/Glasgow.Services.FunctionalTests.csproj --configuration Release --verbosity normal